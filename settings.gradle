pluginManagement {
	repositories {
		google {
			content {
				includeGroupByRegex("com\\.android.*")
				includeGroupByRegex("com\\.google.*")
				includeGroupByRegex("androidx.*")
			}
		}
		mavenCentral()
		gradlePluginPortal()
		maven {
			url 'https://jitpack.io'
			content {
				includeGroupByRegex("com\\.github.*")
			}
		}
	}
}
dependencyResolutionManagement {
	repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
	repositories {
		google()
		mavenCentral()
		maven {
			url 'https://jitpack.io'
		}
	}
}

def parsersDir = [file('../kosen-parsers'), file('../kosen-parsers'), file('kosen-parsers'), file('kosen-parsers')].find { it.exists() }
if (parsersDir != null) {
	includeBuild(parsersDir) {
		dependencySubstitution {
			substitute module('com.github.Ithan-Cassiano:kosen-parsers') using project(':')
		}
	}
} else {
	throw new GradleException(
		'kosen-parsers não encontrado. Clone o repositório privado ao lado do app:\n' +
		'  git clone git@github.com:Ithan-Cassiano/kosen-parsers.git ../kosen-parsers\n' +
		'ou dentro da pasta do app:\n' +
		'  git clone git@github.com:Ithan-Cassiano/kosen-parsers.git kosen-parsers\n' +
		'JitPack não funciona com repositório privado.'
	)
}

include ':app'
rootProject.name = "Kosen"
