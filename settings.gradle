pluginManagement {
	repositories {
		google {
			content {
				includeGroupByRegex("com\\.android.*")
				includeGroupByRegex("com\\.google.*")
				includeGroupByRegex("androidx.*")
			}
		}
		mavenCentral()
		gradlePluginPortal()
		maven {
			url 'https://jitpack.io'
			content {
				includeGroupByRegex("com\\.github.*")
			}
		}
	}
}
dependencyResolutionManagement {
	repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
	repositories {
		google()
		mavenCentral()
		maven {
			url 'https://jitpack.io'
		}
	}
}

def parsersDir = [file('../kaisoku-parsers'), file('kaisoku-parsers')].find { it.exists() }
if (parsersDir != null) {
	includeBuild(parsersDir) {
		dependencySubstitution {
			substitute module('com.github.glitch-228:kosen-parsers') using project(':')
		}
	}
} else {
	logger.lifecycle('kaisoku-parsers not found locally — using JitPack dependency')
}

include ':app'
rootProject.name = "Kosen"
