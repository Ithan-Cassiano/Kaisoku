name: Build Debug

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    branches:
      - main
      - devel
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout parsers
        uses: actions/checkout@v4
        with:
          repository: Ithan-Cassiano/kosen-parsers
          path: kosen-parsers
          token: ${{ secrets.KOSEN_REPO_PAT || secrets.GITHUB_TOKEN }}

      - name: Verify parsers checkout
        run: test -f kosen-parsers/settings.gradle.kts || test -f kosen-parsers/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kosen-debug-apk
          path: app/build/outputs/apk/debug/*.apk
