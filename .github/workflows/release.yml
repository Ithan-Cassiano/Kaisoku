name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout parsers
        uses: actions/checkout@v4
        with:
          repository: Ithan-Cassiano/kaisoku-parsers
          path: kaisoku-parsers
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KOSEN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > kosen-release.jks
            echo "kosen.storeFile=kosen-release.jks" >> local.properties
            echo "kosen.storePassword=${{ secrets.KOSEN_STORE_PASSWORD }}" >> local.properties
            echo "kosen.keyAlias=${{ secrets.KOSEN_KEY_ALIAS }}" >> local.properties
            echo "kosen.keyPassword=${{ secrets.KOSEN_KEY_PASSWORD }}" >> local.properties
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK" "Kosen-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Kosen-*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
